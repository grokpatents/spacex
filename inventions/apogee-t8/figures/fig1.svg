<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#fff"/>
  <!-- Firewall plate tank side -->
  <rect x="50" y="220" width="700" height="6" fill="none" stroke="#111" stroke-width="2"/>
  <text x="400" y="210" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">firewall (16) tank side</text>
  <!-- Engine bay label below -->
  <text x="400" y="280" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">engine bay below</text>
  <!-- Valve body -->
  <rect x="340" y="200" width="120" height="90" fill="none" stroke="#111" stroke-width="2"/>
  <text x="400" y="195" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">valve body (12)</text>
  <!-- Opening in firewall -->
  <rect x="380" y="220" width="40" height="6" fill="#fff" stroke="#111" stroke-width="1"/>
  <line x1="400" y1="226" x2="300" y2="170" stroke="#111" stroke-width="1"/>
  <text x="280" y="165" font-family="Helvetica, Arial, sans-serif" font-size="11">opening (14)</text>
  <!-- Poppet -->
  <polygon points="360,240 440,240 430,280 370,280" fill="none" stroke="#111" stroke-width="2"/>
  <text x="400" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">poppet (18)</text>
  <!-- Spring -->
  <path d="M370,280 Q380,300 370,320 Q360,340 370,360" fill="none" stroke="#111" stroke-width="2"/>
  <path d="M430,280 Q420,300 430,320 Q440,340 430,360" fill="none" stroke="#111" stroke-width="2"/>
  <text x="400" y="375" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">spring (20)</text>
  <!-- Seal -->
  <rect x="365" y="235" width="70" height="8" fill="none" stroke="#111" stroke-width="1.5"/>
  <line x1="435" y1="240" x2="475" y2="240" stroke="#111" stroke-width="1"/>
  <text x="490" y="245" font-family="Helvetica, Arial, sans-serif" font-size="11">seal (26)</text>
  <!-- Heat shield duct -->
  <rect x="360" y="360" width="80" height="160" fill="none" stroke="#111" stroke-width="2"/>
  <text x="400" y="535" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">heat shield duct (24)</text>
  <!-- Hatching on duct -->
  <path d="M365,370 L375,380 M375,370 L385,380 M385,370 L395,380" fill="none" stroke="#111" stroke-width="0.8"/>
  <path d="M365,390 L375,400 M375,390 L385,400" fill="none" stroke="#111" stroke-width="0.8"/>
  <path d="M365,410 L375,420 M375,410 L385,420" fill="none" stroke="#111" stroke-width="0.8"/>
  <!-- Pressure sensor -->
  <circle cx="300" cy="180" r="12" fill="none" stroke="#111" stroke-width="2"/>
  <text x="300" y="185" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">28</text>
  <line x1="312" y1="180" x2="340" y2="200" stroke="#111" stroke-width="1"/>
  <text x="350" y="175" font-family="Helvetica, Arial, sans-serif" font-size="11">sensor (28)</text>
  <!-- Burst disk -->
  <rect x="425" y="205" width="25" height="4" fill="none" stroke="#111" stroke-width="1.5"/>
  <line x1="437" y1="209" x2="490" y2="160" stroke="#111" stroke-width="1"/>
  <text x="500" y="155" font-family="Helvetica, Arial, sans-serif" font-size="11">burst disk (30)</text>
  <!-- Engine nozzle neighbor 1 -->
  <rect x="80" y="420" width="70" height="140" fill="none" stroke="#111" stroke-width="2"/>
  <text x="115" y="575" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">engine nozzle</text>
  <!-- Engine nozzle neighbor 2 -->
  <rect x="650" y="420" width="70" height="140" fill="none" stroke="#111" stroke-width="2"/>
  <text x="685" y="575" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">engine nozzle</text>
  <!-- Cavity arrow and label -->
  <line x1="100" y1="200" x2="100" y2="140" stroke="#111" stroke-width="1.5"/>
  <text x="100" y="130" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">cavity (22) tank side</text>
  <!-- Leader lines to all numerals -->
  <line x1="400" y1="206" x2="300" y2="150" stroke="#111" stroke-width="1"/>
  <line x1="400" y1="260" x2="480" y2="310" stroke="#111" stroke-width="1"/>
  <line x1="400" y1="340" x2="480" y2="390" stroke="#111" stroke-width="1"/>
  <line x1="400" y1="440" x2="300" y2="480" stroke="#111" stroke-width="1"/>
  <line x1="437" y1="207" x2="520" y2="130" stroke="#111" stroke-width="1"/>
  <!-- Caption -->
  <text x="400" y="595" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 1</text>
</svg>