<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#fff"/>
  <!-- Firewall cross section detail -->
  <rect x="100" y="150" width="600" height="8" fill="none" stroke="#111" stroke-width="2"/>
  <text x="400" y="140" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">firewall (16)</text>
  <!-- Poppet closed position -->
  <polygon points="340,160 460,160 450,200 350,200" fill="none" stroke="#111" stroke-width="2"/>
  <text x="400" y="220" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">poppet closed (18)</text>
  <!-- Poppet open position offset -->
  <polygon points="340,240 460,240 450,290 350,290" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="400" y="310" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">poppet open position</text>
  <!-- Spring compressed -->
  <path d="M350,200 Q360,215 350,230 Q340,245 350,260" fill="none" stroke="#111" stroke-width="2"/>
  <path d="M450,200 Q440,215 450,230 Q460,245 450,260" fill="none" stroke="#111" stroke-width="2"/>
  <text x="400" y="280" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">spring compressed (20)</text>
  <!-- Vent path arrows -->
  <line x1="400" y1="290" x2="400" y2="380" stroke="#111" stroke-width="2"/>
  <polygon points="395,370 405,370 400,385" fill="#111"/>
  <text x="420" y="380" font-family="Helvetica, Arial, sans-serif" font-size="11">vent flow aft</text>
  <!-- Duct section with hatching -->
  <rect x="360" y="380" width="80" height="140" fill="none" stroke="#111" stroke-width="2"/>
  <path d="M365,390 L375,400 M375,390 L385,400 M385,390 L395,400" fill="none" stroke="#111" stroke-width="0.8"/>
  <path d="M365,410 L375,420 M375,410 L385,420" fill="none" stroke="#111" stroke-width="0.8"/>
  <path d="M365,430 L375,440 M375,430 L385,440" fill="none" stroke="#111" stroke-width="0.8"/>
  <text x="400" y="535" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">heat shield duct (24)</text>
  <!-- Reset gap label -->
  <line x1="400" y1="200" x2="520" y2="200" stroke="#111" stroke-width="1"/>
  <text x="540" y="205" font-family="Helvetica, Arial, sans-serif" font-size="11">reseat gap 5 kPa</text>
  <!-- Cavity pressure indicator -->
  <line x1="150" y1="150" x2="150" y2="100" stroke="#111" stroke-width="1.5"/>
  <text x="150" y="90" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">cavity (22)</text>
  <!-- Engine bay reference -->
  <rect x="100" y="450" width="600" height="20" fill="none" stroke="#111" stroke-width="1"/>
  <text x="400" y="465" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">engine bay</text>
  <!-- Caption -->
  <text x="400" y="590" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 2</text>
</svg>